name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, type-check, and build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Build unpacked Windows artifact
        run: npx electron-builder --win --x64 --dir

      - name: Verify packaged Markdown renderer isolation
        shell: pwsh
        run: |
          $env:SAFIRE_PACKAGED_APP = Join-Path $PWD 'release\win-unpacked\Safire.exe'
          node test-support/packaged-renderer-security.mjs

      - name: Verify packaged memory runtime
        shell: pwsh
        run: |
          $env:SAFIRE_PACKAGED_MEMORY_LAUNCHER = Join-Path $PWD 'release\win-unpacked\resources\safire-memory-mcp.cmd'
          node --test test/memory-packaging.test.mjs

  linux:
    name: Linux package and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run checks
        run: npm run check

      - name: Build unpacked Linux artifact
        run: npx electron-builder --linux --x64 --dir

      - name: Verify packaged Markdown renderer isolation
        run: SAFIRE_PACKAGED_APP="$PWD/release/linux-unpacked/safire" xvfb-run --auto-servernum node test-support/packaged-renderer-security.mjs

      - name: Verify packaged memory runtime
        run: SAFIRE_PACKAGED_MEMORY_LAUNCHER="$PWD/release/linux-unpacked/resources/safire-memory-mcp.sh" node --test test/memory-packaging.test.mjs

  macos:
    name: macOS package and runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run checks
        run: npm run check

      - name: Build unpacked macOS artifact
        run: npx electron-builder --mac --${{ matrix.arch }} --dir

      - name: Verify packaged Markdown renderer isolation
        run: |
          packaged_app=$(find release -path '*/Safire.app/Contents/MacOS/Safire' -type f -print -quit)
          test -n "$packaged_app"
          SAFIRE_PACKAGED_APP="$packaged_app" node test-support/packaged-renderer-security.mjs

      - name: Verify packaged memory runtime
        run: |
          packaged_launcher=$(find release -path '*/Safire.app/Contents/Resources/safire-memory-mcp.sh' -type f -print -quit)
          test -n "$packaged_launcher"
          SAFIRE_PACKAGED_MEMORY_LAUNCHER="$packaged_launcher" node --test test/memory-packaging.test.mjs
